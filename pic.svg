
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#321715"/>
      <stop offset="55%" stop-color="#28140f"/>
      <stop offset="100%" stop-color="#1b100d"/>
    </linearGradient>
    <linearGradient id="peach" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe0c9"/>
      <stop offset="100%" stop-color="#f09a79"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#efb49c" opacity=".22"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .small{font-family:Arial,sans-serif;fill:#d9ad9a;letter-spacing:2.5px}
      .line{fill:none;stroke:#b97863;stroke-width:1.2;opacity:.65}
      .float{animation:float 3s ease-in-out infinite}
      .pulse{animation:pulse 2s ease-in-out infinite}
      .orbit{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
      .dash{stroke-dasharray:5 6;animation:dash 7s linear infinite}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
      @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes dash{to{stroke-dashoffset:-100}}
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="500" rx="25" fill="url(#bg)"/>
  <rect width="1200" height="500" rx="25" fill="url(#dots)"/>
  <rect x="30" y="30" width="1140" height="440" rx="24"
        fill="none" stroke="#9c6252" stroke-opacity=".55"/>

  <!-- Header accent -->
  <circle cx="82" cy="80" r="6" fill="#ffd1b5" filter="url(#glow)"/>
  <path d="M82 80 H275" stroke="#f4b59a" stroke-width="3"
        stroke-linecap="round"/>
  <text x="100" y="113" class="small" font-size="13">MACHINE LEARNING / CLASSIFICATION</text>

  <!-- Main title -->
  <text x="98" y="214" font-family="Arial,sans-serif"
        font-size="55" font-weight="700" fill="#fff4ed">Part C :</text>
  <text x="98" y="274" font-family="Arial,sans-serif"
        font-size="43" font-weight="700" fill="url(#peach)">Baseline Model</text>
  <text x="98" y="326" font-family="Arial,sans-serif"
        font-size="43" font-weight="700" fill="url(#peach)">K-Nearest Neighbors</text>

  <rect x="100" y="351" width="112" height="5" rx="2.5" fill="#f4a88a"/>
  <text x="100" y="392" font-family="Arial,sans-serif"
        font-size="18" fill="#e8c7b8">Measure Distance</text>
  <circle cx="271" cy="386" r="3" fill="#f6a17f"/>
  <text x="286" y="392" font-family="Arial,sans-serif"
        font-size="18" fill="#e8c7b8">Find Neighbors</text>
  <circle cx="441" cy="386" r="3" fill="#f6a17f"/>
  <text x="456" y="392" font-family="Arial,sans-serif"
        font-size="18" fill="#e8c7b8">Predict Class</text>

  <!-- Scatter plot panel -->
  <rect x="686" y="70" width="294" height="330" rx="17"
        fill="#261410" stroke="#855344" stroke-width="1.2"/>

  <text x="710" y="98" class="small" font-size="10">NEIGHBOR MAP</text>
  <text x="710" y="119" font-family="Arial,sans-serif"
        font-size="12" fill="#b99180">Distance-based learning</text>

  <!-- Plot grid -->
  <g stroke="#a66e59" stroke-width=".7" opacity=".22">
    <path d="M720 145 V357 M755 145 V357 M790 145 V357
             M825 145 V357 M860 145 V357 M895 145 V357
             M930 145 V357"/>
    <path d="M720 145 H948 M720 180 H948 M720 215 H948
             M720 250 H948 M720 285 H948 M720 320 H948
             M720 355 H948"/>
  </g>

  <!-- Plot axes -->
  <path d="M720 145 V357 H948" fill="none"
        stroke="#d29a80" stroke-width="1.3"/>
  <text x="831" y="379" font-family="Arial,sans-serif"
        font-size="10" fill="#cda08c">FEATURE X</text>
  <text x="700" y="151" font-family="Arial,sans-serif"
        font-size="9" fill="#cda08c">Y</text>

  <!-- Neighbor distance circle -->
  <circle cx="837" cy="249" r="68" fill="#e99b7c" fill-opacity=".045"
          stroke="#f4b59a" stroke-width="1.4" stroke-dasharray="5 6"
          class="pulse"/>
  <circle cx="837" cy="249" r="43" fill="none"
          stroke="#d89176" stroke-width="1" stroke-dasharray="3 5"/>

  <!-- Class A points -->
  <g fill="#f3a17f">
    <circle cx="749" cy="191" r="5"/>
    <circle cx="777" cy="224" r="5"/>
    <circle cx="754" cy="273" r="5"/>
    <circle cx="800" cy="306" r="5"/>
    <circle cx="812" cy="202" r="5"/>
    <circle cx="873" cy="307" r="5"/>
    <circle cx="903" cy="330" r="5"/>
    <circle cx="915" cy="196" r="5"/>
  </g>

  <!-- Class B points -->
  <g fill="#e8d4c5">
    <rect x="860" y="169" width="10" height="10" rx="2"/>
    <rect x="900" y="226" width="10" height="10" rx="2"/>
    <rect x="910" y="277" width="10" height="10" rx="2"/>
    <rect x="880" y="340" width="10" height="10" rx="2"/>
    <rect x="931" y="244" width="10" height="10" rx="2"/>
    <rect x="868" y="204" width="10" height="10" rx="2"/>
  </g>

  <!-- Highlighted nearest neighbors -->
  <g class="pulse" fill="none" stroke="#ffceb1" stroke-width="1.6">
    <circle cx="812" cy="202" r="10"/>
    <circle cx="777" cy="224" r="10"/>
    <circle cx="800" cy="306" r="10"/>
  </g>

  <!-- Animated distance lines -->
  <g fill="none" stroke="#f5b69a" stroke-width="1.5" class="dash">
    <path d="M837 249 L812 202"/>
    <path d="M837 249 L777 224"/>
    <path d="M837 249 L800 306"/>
  </g>

  <!-- Query point -->
  <g class="pulse">
    <circle cx="837" cy="249" r="15" fill="#f3a17f" opacity=".17"/>
    <circle cx="837" cy="249" r="9" fill="#fff0e5" stroke="#ffb18e" stroke-width="2"/>
    <circle cx="837" cy="249" r="3" fill="#713c2d"/>
  </g>

  <text x="852" y="244" font-family="Arial,sans-serif"
        font-size="10" font-weight="700" fill="#ffe0c9">QUERY</text>
  <text x="852" y="256" font-family="Arial,sans-serif"
        font-size="9" fill="#d8ac99">POINT</text>

  <!-- K value card -->
  <g class="float">
    <rect x="996" y="111" width="151" height="112" rx="14"
          fill="#45251f" stroke="#c8856b" stroke-width="1.4"/>
    <text x="1015" y="136" class="small" font-size="10">MODEL PARAMETER</text>
    <text x="1015" y="183" font-family="Arial,sans-serif"
          font-size="43" font-weight="700" fill="#ffe0c9">K = 3</text>
    <text x="1015" y="204" font-family="Arial,sans-serif"
          font-size="11" fill="#d8ac99">Nearest neighbors</text>
  </g>

  <!-- Prediction card -->
  <g class="float" style="animation-delay:-1s">
    <rect x="996" y="242" width="151" height="112" rx="14"
          fill="#45251f" stroke="#c8856b" stroke-width="1.4"/>
    <text x="1015" y="266" class="small" font-size="10">PREDICTION</text>
    <circle cx="1027" cy="292" r="6" fill="#f3a17f"/>
    <text x="1041" y="296" font-family="Arial,sans-serif"
          font-size="13" fill="#ffe0c9">Class A</text>
    <path d="M1015 310 H1128" stroke="#9c6450" stroke-width="1"/>
    <text x="1015" y="330" font-family="Arial,sans-serif"
          font-size="10" fill="#d8ac99">Majority voting</text>
    <circle cx="1128" cy="330" r="4" fill="#ffc7a8" class="pulse"/>
  </g>

  <!-- Connector to prediction -->
  <path d="M951 249 H980 Q987 249 987 258 V282 H996"
        fill="none" stroke="#e9a68b" stroke-width="1.5"
        stroke-dasharray="4 5" class="dash"/>
  <circle cx="980" cy="249" r="3" fill="#ffc7a8" class="pulse"/>

  <!-- Bottom status -->
  <rect x="882" y="376" width="240" height="34" rx="17"
        fill="#2b1712" stroke="#b8755c" stroke-width="1.2"/>
  <circle cx="903" cy="393" r="5" fill="#ffc6a5" filter="url(#glow)"/>
  <text x="918" y="397" font-family="Arial,sans-serif"
        font-size="11" letter-spacing="2" fill="#f5c7ad">NEIGHBORS DETECTED</text>

  <!-- Bottom wave lines -->
  <path d="M0 426 C125 375 215 468 350 439
           S540 395 670 445 S900 481 1050 433 S1155 417 1200 433"
        fill="none" stroke="#b96d55" stroke-width="1.2" opacity=".65"/>
  <path d="M0 450 C130 397 220 490 360 460
           S550 416 690 462 S920 495 1060 455 S1155 438 1200 453"
        fill="none" stroke="#a75e49" stroke-width="1" opacity=".5"/>
  <g fill="#ffc4a5" filter="url(#glow)" class="pulse">
    <circle cx="350" cy="439" r="3"/>
    <circle cx="670" cy="445" r="3"/>
    <circle cx="1050" cy="433" r="3"/>
  </g>

  <!-- Footer -->
  <text x="100" y="461" font-family="Arial,sans-serif"
        font-size="10" letter-spacing="2.5" fill="#c88d76">
    DISTANCE  ·  NEIGHBORS  ·  CLASSIFICATION
  </text>

  <!-- Corner arrow -->
  <path d="M1120 80 H1144 V104 M1144 80 L1124 100"
        fill="none" stroke="#f4b59a" stroke-width="1.8"/>
</svg>
