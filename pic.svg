
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24160D"/>
      <stop offset=".5" stop-color="#3A171A"/>
      <stop offset="1" stop-color="#160F0B"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0CDBD"/>
      <stop offset="1" stop-color="#C49A8A"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    .float {
      animation: float 4.2s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    .float2 {
      animation: float 5.4s ease-in-out infinite reverse;
      transform-box: fill-box;
      transform-origin: center;
    }
    .orbit {
      stroke-dasharray: 5 9;
      animation: orbit 18s linear infinite;
      transform-origin: 930px 240px;
    }
    .pulse {
      animation: pulse 2.5s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    .link {
      stroke-dasharray: 7 8;
      animation: link 3s linear infinite;
    }
    .spark {
      animation: spark 2s ease-in-out infinite;
    }
    @keyframes float {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes orbit {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%,100% { opacity: .5; transform: scale(.96); }
      50% { opacity: 1; transform: scale(1.06); }
    }
    @keyframes link {
      to { stroke-dashoffset: -90; }
    }
    @keyframes spark {
      0%,100% { opacity: .25; }
      50% { opacity: 1; }
    }
  </style>

  <rect width="1200" height="500" rx="28" fill="url(#bg)"/>

  <path d="M54 88V55H87 M1113 55H1146V88
           M54 412V445H87 M1113 445H1146V412"
        fill="none" stroke="#C49A8A" stroke-width="1.5" opacity=".7"/>
  <rect x="54" y="55" width="1092" height="390" rx="22"
        fill="none" stroke="#C49A8A" stroke-opacity=".16"/>

  <!-- Part C label -->
  <g transform="translate(88 88)">
    <rect width="92" height="30" rx="15"
          fill="#854D4A" stroke="#C49A8A" stroke-opacity=".65"/>
    <text x="46" y="20" text-anchor="middle"
          fill="#F4E7DF" font-family="Arial,sans-serif"
          font-size="12" font-weight="700" letter-spacing="1.6">PART C</text>
    <circle cx="108" cy="15" r="4" fill="#E0B8A5"
            filter="url(#glow)" class="spark"/>
    <path d="M121 15H190" stroke="#854D4A" stroke-width="1.5"/>
  </g>

  <!-- Title -->
  <text x="88" y="158" fill="#C49A8A"
        font-family="Arial,sans-serif" font-size="12"
        letter-spacing="4">MACHINE LEARNING / BASELINE</text>
  <text x="84" y="222" fill="#F4E7DF"
        font-family="Arial,sans-serif" font-size="43"
        font-weight="700">Baseline Model</text>
  <text x="84" y="277" fill="#E0B8A5"
        font-family="Arial,sans-serif" font-size="43"
        font-weight="700">K-Nearest Neighbors</text>
  <rect x="88" y="301" width="105" height="4" rx="2" fill="url(#rose)"/>
  <text x="88" y="337" fill="#D7BEB4"
        font-family="Arial,sans-serif" font-size="15">
    Find nearby points. Let the neighbors decide.
  </text>

  <!-- KNN workflow -->
  <g transform="translate(88 385)">
    <circle cx="5" cy="0" r="4" fill="#E0B8A5" class="pulse"/>
    <text x="18" y="4" fill="#C49A8A" font-family="Arial,sans-serif"
          font-size="10" letter-spacing="1.5">DISTANCE</text>
    <path d="M103 0H133" stroke="#854D4A" stroke-width="1.5"/>
    <circle cx="144" cy="0" r="4" fill="#854D4A" class="spark"/>
    <text x="157" y="4" fill="#C49A8A" font-family="Arial,sans-serif"
          font-size="10" letter-spacing="1.5">NEIGHBORS</text>
    <path d="M268 0H298" stroke="#854D4A" stroke-width="1.5"/>
    <circle cx="309" cy="0" r="4" fill="#E0B8A5" class="pulse"/>
    <text x="322" y="4" fill="#C49A8A" font-family="Arial,sans-serif"
          font-size="10" letter-spacing="1.5">PREDICT</text>
  </g>

  <!-- KNN illustration -->
  <g>
    <rect x="690" y="78" width="420" height="340" rx="26"
          fill="#854D4A" fill-opacity=".11"
          stroke="#C49A8A" stroke-opacity=".24"/>

    <circle cx="900" cy="245" r="155" fill="none"
            stroke="#854D4A" stroke-width="1.5" class="orbit"/>
    <circle cx="900" cy="245" r="120" fill="none"
            stroke="#C49A8A" stroke-opacity=".24"
            stroke-dasharray="3 8"/>

    <!-- Nearest-neighbor connections -->
    <g fill="none" stroke="#C49A8A" stroke-width="1.5"
       opacity=".8" class="link">
      <path d="M830 177L900 245"/>
      <path d="M1001 188L900 245"/>
      <path d="M823 293L900 245"/>
      <path d="M970 319L900 245"/>
      <path d="M1014 271L900 245"/>
    </g>

    <!-- One data class -->
    <g fill="#C49A8A" stroke="#F0CDBD" stroke-width="1.5">
      <circle cx="830" cy="177" r="9" class="float"/>
      <circle cx="1001" cy="188" r="9" class="float2"/>
      <circle cx="823" cy="293" r="9" class="float2"/>
      <circle cx="970" cy="319" r="9" class="float"/>
      <circle cx="1014" cy="271" r="9" class="float2"/>
      <circle cx="779" cy="220" r="6" opacity=".65"/>
      <circle cx="1050" cy="332" r="6" opacity=".65"/>
    </g>

    <!-- Another data class -->
    <g fill="#854D4A" stroke="#E0B8A5" stroke-width="1.5">
      <circle cx="858" cy="245" r="8" class="float2"/>
      <circle cx="945" cy="153" r="8" class="float"/>
      <circle cx="1024" cy="226" r="8" class="float2"/>
      <circle cx="876" cy="342" r="8" class="float"/>
      <circle cx="944" cy="365" r="6" opacity=".7"/>
    </g>

    <!-- Query point -->
    <circle cx="900" cy="245" r="22" fill="#24160D"
            stroke="#F0CDBD" stroke-width="2" class="pulse"/>
    <circle cx="900" cy="245" r="7"
            fill="#F4E7DF" filter="url(#glow)"/>
    <path d="M900 214V224 M900 266V276
             M869 245H879 M921 245H931"
          stroke="#F0CDBD" stroke-width="1.5"
          stroke-linecap="round"/>

    <!-- K value -->
    <g transform="translate(1000 96)">
      <rect width="78" height="32" rx="16"
            fill="#24160D" stroke="#C49A8A"/>
      <text x="39" y="21" text-anchor="middle"
            fill="#E0B8A5" font-family="Arial,sans-serif"
            font-size="12" font-weight="700" letter-spacing="1">K = 5</text>
    </g>

    <g transform="translate(742 370)">
      <circle cx="5" cy="0" r="4" fill="#C49A8A"/>
      <text x="16" y="4" fill="#D7BEB4"
            font-family="Arial,sans-serif" font-size="10"
            letter-spacing="1.3">TRAINING POINTS</text>
    </g>

    <g fill="#E0B8A5" filter="url(#glow)">
      <circle cx="746" cy="128" r="3" class="spark"/>
      <circle cx="1060" cy="145" r="3" class="spark"/>
      <circle cx="1070" cy="365" r="4" class="spark"/>
    </g>
  </g>

  <text x="83" y="466" fill="#C49A8A" opacity=".6"
        font-family="Arial,sans-serif" font-size="9"
        letter-spacing="3">
    DISTANCE • LOCAL PATTERNS • NEIGHBOR VOTING
  </text>
</svg>
