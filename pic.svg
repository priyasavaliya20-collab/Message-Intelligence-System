
<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="500" viewBox="0 0 1200 500">

  <title>Part C - Baseline Model - K-Nearest Neighbors</title>
  <desc>Dark maroon machine learning presentation slide with animated KNN visualization.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#321b18"/>
      <stop offset="70%" stop-color="#3b1b1e"/>
      <stop offset="100%" stop-color="#211411"/>
    </linearGradient>

    <linearGradient id="heading" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e4b9a8"/>
      <stop offset="100%" stop-color="#d2a091"/>
    </linearGradient>

    <radialGradient id="centerGlow">
      <stop offset="0%" stop-color="#fff4e8"/>
      <stop offset="100%" stop-color="#d8b7a4"/>
    </radialGradient>

    <style>
      .heading {
        font-family: Arial, Helvetica, sans-serif;
        font-weight: 700;
        font-size: 43px;
        fill: #f5e5dc;
      }
      .subheading {
        font-family: Arial, Helvetica, sans-serif;
        font-weight: 700;
        font-size: 43px;
        fill: url(#heading);
      }
      .eyebrow {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 12px;
        letter-spacing: 3px;
        fill: #c49b8c;
      }
      .body {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 14px;
        fill: #d0b9ad;
      }
      .label {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 10px;
        letter-spacing: 1.4px;
        fill: #cda99a;
      }
      .ring {
        fill: none;
        stroke: #a76a5e;
        stroke-width: 1.4;
        stroke-dasharray: 4 8;
        transform-origin: 900px 245px;
        animation: rotateRing 24s linear infinite;
      }
      .point {
        fill: #d3a994;
        stroke: #e9c5b1;
        stroke-width: 1.5;
        transform-box: fill-box;
        transform-origin: center;
        animation: pointPulse 2.5s ease-in-out infinite;
      }
      .neighbor {
        stroke: #c29a89;
        stroke-width: 1.4;
        stroke-dasharray: 5 6;
        fill: none;
      }
      @keyframes rotateRing {
        to { stroke-dashoffset: -96; }
      }
      @keyframes pointPulse {
        0%, 100% { opacity: .75; }
        50% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .ring, .point { animation: none; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="500" rx="24" fill="url(#bg)"/>

  <!-- Frame -->
  <rect x="54" y="54" width="1092" height="392"
        rx="2" fill="none" stroke="#78534a"
        stroke-opacity=".42"/>

  <!-- Corner details -->
  <g stroke="#a67b6a" stroke-width="1.3" fill="none">
    <path d="M54 88V54H88"/>
    <path d="M1112 54H1146V88"/>
    <path d="M54 412V446H88"/>
    <path d="M1112 446H1146V412"/>
  </g>

  <!-- Part label -->
  <rect x="88" y="88" width="92" height="30" rx="15"
        fill="#854b49" stroke="#b37c70"/>

  <text x="134" y="108" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="12"
        font-weight="700" letter-spacing="1"
        fill="#f5e5dc">PART C</text>

  <circle cx="196" cy="103" r="4" fill="#8b6256"/>
  <path d="M209 103H278" stroke="#8a554d" stroke-width="1.5"/>

  <!-- Left typography -->
  <text x="88" y="158" class="eyebrow">
    MACHINE LEARNING / BASELINE
  </text>

  <text x="84" y="222" class="heading">
    Baseline Model
  </text>

  <text x="84" y="277" class="subheading">
    K-Nearest Neighbors
  </text>

  <rect x="88" y="301" width="105" height="4"
        rx="2" fill="#d5a899"/>

  <text x="88" y="337" class="body">
    Find nearby points. Let the neighbors decide.
  </text>

  <!-- Workflow -->
  <g class="label">
    <circle cx="93" cy="385" r="4" fill="#d3a495"/>
    <text x="105" y="389">DISTANCE</text>

    <path d="M191 385H221" stroke="#8a554d"/>

    <circle cx="232" cy="385" r="4" fill="#75443d"/>
    <text x="245" y="389">NEIGHBORS</text>

    <path d="M356 385H392" stroke="#8a554d"/>

    <circle cx="397" cy="385" r="4" fill="#d3a495"/>
    <text x="410" y="389">PREDICT</text>
  </g>

  <!-- Visualization panel -->
  <rect x="690" y="78" width="420" height="340"
        rx="26" fill="#4a2526" fill-opacity=".28"
        stroke="#77504a" stroke-opacity=".65"/>

  <!-- K badge -->
  <rect x="1000" y="96" width="78" height="32"
        rx="16" fill="#281611" stroke="#c99b88"/>

  <text x="1039" y="116" text-anchor="middle"
        font-family="Georgia, serif" font-size="13"
        fill="#e7c6b4">K = 5</text>

  <!-- Distance rings -->
  <circle class="ring" cx="900" cy="245" r="53"/>
  <circle class="ring" cx="900" cy="245" r="80"/>
  <circle class="ring" cx="900" cy="245" r="108"/>

  <!-- Five nearest-neighbor links -->
  <g class="neighbor">
    <path d="M900 245L830 170"/>
    <path d="M900 245L1001 181"/>
    <path d="M900 245L1014 264"/>
    <path d="M900 245L970 312"/>
    <path d="M900 245L823 286"/>
  </g>

  <!-- Neighbor points -->
  <g>
    <circle class="point" cx="830" cy="170" r="9"/>
    <circle class="point" cx="1001" cy="181" r="9"/>
    <circle class="point" cx="1014" cy="264" r="9"/>
    <circle class="point" cx="970" cy="312" r="9"/>
    <circle class="point" cx="823" cy="286" r="9"/>
  </g>

  <!-- Other training points -->
  <g fill="#89635a" stroke="#c49b8c" stroke-width="1.2">
    <circle class="point" cx="779" cy="220" r="6"/>
    <circle class="point" cx="858" cy="238" r="8" fill="#c49b8c"/>
    <circle class="point" cx="1024" cy="219" r="7"/>
    <circle class="point" cx="876" cy="335" r="8" fill="#c49b8c"/>
    <circle class="point" cx="945" cy="147" r="8" fill="#c49b8c"/>
  </g>

  <!-- Distant points -->
  <g fill="#89635a" opacity=".75">
    <circle cx="746" cy="128" r="3"/>
    <circle cx="1060" cy="145" r="3"/>
    <circle cx="1050" cy="332" r="5"/>
    <circle cx="944" cy="365" r="5"/>
    <circle cx="1070" cy="365" r="4"/>
  </g>

  <!-- Central query point -->
  <circle cx="900" cy="245" r="22"
          fill="#321c18" stroke="#c99e8b" stroke-width="1.8"/>

  <circle cx="900" cy="245" r="8"
          fill="url(#centerGlow)">
    <animate attributeName="r"
             values="7;9;7"
             dur="2.5s"
             repeatCount="indefinite"/>
  </circle>

  <g stroke="#e0b8a4" stroke-width="1.5">
    <path d="M900 213V225"/>
    <path d="M900 265V277"/>
    <path d="M868 245H880"/>
    <path d="M920 245H932"/>
  </g>

  <!-- Legend -->
  <circle cx="747" cy="370" r="4" fill="#d3a994"/>
  <text x="758" y="374" class="label"
        style="font-size:9px">TRAINING POINTS</text>

  <!-- Footer -->
  <text x="82" y="466"
        font-family="Arial, sans-serif"
        font-size="10" letter-spacing="2.3"
        fill="#987368">
    DISTANCE · LOCAL PATTERNS · NEIGHBOR VOTING
  </text>
</svg>
