
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#321715"/>
      <stop offset="55%" stop-color="#28140f"/>
      <stop offset="100%" stop-color="#1b100d"/>
    </linearGradient>
    <linearGradient id="peach" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe0c9"/>
      <stop offset="100%" stop-color="#f09a79"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b96650"/>
      <stop offset="100%" stop-color="#ffc3a1"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#efb49c" opacity=".22"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .small{font-family:Arial,sans-serif;fill:#d9ad9a;letter-spacing:2.3px}
      .float{animation:float 3s ease-in-out infinite}
      .pulse{animation:pulse 2s ease-in-out infinite}
      .dash{stroke-dasharray:5 7;animation:dash 7s linear infinite}
      .grow{transform-box:fill-box;transform-origin:left center;animation:grow 2s ease-out both}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
      @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
      @keyframes dash{to{stroke-dashoffset:-120}}
      @keyframes grow{from{transform:scaleX(.08)}to{transform:scaleX(1)}}
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="500" rx="25" fill="url(#bg)"/>
  <rect width="1200" height="500" rx="25" fill="url(#dots)"/>
  <rect x="30" y="30" width="1140" height="440" rx="24"
        fill="none" stroke="#9c6252" stroke-opacity=".55"/>

  <!-- Header -->
  <circle cx="82" cy="80" r="6" fill="#ffd1b5" filter="url(#glow)"/>
  <path d="M82 80 H275" stroke="#f4b59a" stroke-width="3"
        stroke-linecap="round"/>
  <text x="100" y="113" class="small" font-size="13">MACHINE LEARNING / PERFORMANCE ANALYSIS</text>

  <!-- Main title -->
  <text x="98" y="218" font-family="Arial,sans-serif"
        font-size="57" font-weight="700" fill="#fff4ed">Part F :</text>
  <text x="98" y="280" font-family="Arial,sans-serif"
        font-size="43" font-weight="700" fill="url(#peach)">Model Comparison</text>
  <text x="98" y="333" font-family="Arial,sans-serif"
        font-size="43" font-weight="700" fill="url(#peach)">&amp; Evaluation</text>

  <rect x="100" y="357" width="112" height="5" rx="2.5" fill="#f4a88a"/>
  <text x="100" y="396" font-family="Arial,sans-serif"
        font-size="17" fill="#e8c7b8">Compare Models</text>
  <circle cx="256" cy="390" r="3.5" fill="#f6a17f"/>
  <text x="271" y="396" font-family="Arial,sans-serif"
        font-size="17" fill="#e8c7b8">Evaluate Metrics</text>
  <circle cx="431" cy="390" r="3.5" fill="#f6a17f"/>
  <text x="446" y="396" font-family="Arial,sans-serif"
        font-size="17" fill="#e8c7b8">Select Best Fit</text>

  <!-- Comparison panel -->
  <rect x="620" y="67" width="355" height="331" rx="17"
        fill="#261410" stroke="#855344" stroke-width="1.2"/>
  <text x="644" y="96" class="small" font-size="11">MODEL SCOREBOARD</text>
  <text x="644" y="116" font-family="Arial,sans-serif"
        font-size="11" fill="#b99180">Illustrative comparison · not actual results</text>

  <!-- Chart grid -->
  <g stroke="#a66e59" stroke-width=".7" opacity=".25">
    <path d="M750 143 V328 M790 143 V328 M830 143 V328
             M870 143 V328 M910 143 V328 M950 143 V328"/>
  </g>
  <g font-family="Arial,sans-serif" font-size="9" fill="#bd9583">
    <text x="745" y="137">0</text>
    <text x="783" y="137">20</text>
    <text x="823" y="137">40</text>
    <text x="863" y="137">60</text>
    <text x="903" y="137">80</text>
    <text x="940" y="137">100%</text>
  </g>

  <!-- Model 1 -->
  <text x="644" y="168" font-family="Arial,sans-serif"
        font-size="12" fill="#f4d5c4">KNN</text>
  <rect x="750" y="153" width="200" height="19" rx="5" fill="#492821"/>
  <rect x="750" y="153" width="142" height="19" rx="5"
        fill="url(#bar)" class="grow"/>
  <text x="901" y="167" font-family="Arial,sans-serif"
        font-size="10" fill="#ffe0c9">71%</text>

  <!-- Model 2 -->
  <text x="644" y="213" font-family="Arial,sans-serif"
        font-size="12" fill="#f4d5c4">SVM</text>
  <rect x="750" y="198" width="200" height="19" rx="5" fill="#492821"/>
  <rect x="750" y="198" width="164" height="19" rx="5"
        fill="url(#bar)" class="grow" style="animation-delay:.25s"/>
  <text x="920" y="212" font-family="Arial,sans-serif"
        font-size="10" fill="#ffe0c9">82%</text>

  <!-- Model 3 -->
  <text x="644" y="258" font-family="Arial,sans-serif"
        font-size="12" fill="#f4d5c4">Naive Bayes</text>
  <rect x="750" y="243" width="200" height="19" rx="5" fill="#492821"/>
  <rect x="750" y="243" width="150" height="19" rx="5"
        fill="url(#bar)" class="grow" style="animation-delay:.5s"/>
  <text x="906" y="257" font-family="Arial,sans-serif"
        font-size="10" fill="#ffe0c9">75%</text>

  <!-- Model 4 -->
  <text x="644" y="303" font-family="Arial,sans-serif"
        font-size="12" fill="#f4d5c4">Baseline</text>
  <rect x="750" y="288" width="200" height="19" rx="5" fill="#492821"/>
  <rect x="750" y="288" width="130" height="19" rx="5"
        fill="url(#bar)" class="grow" style="animation-delay:.75s"/>
  <text x="886" y="302" font-family="Arial,sans-serif"
        font-size="10" fill="#ffe0c9">65%</text>

  <!-- Legend -->
  <circle cx="649" cy="355" r="4" fill="#f3a17f"/>
  <text x="660" y="359" font-family="Arial,sans-serif"
        font-size="10" fill="#d8ac99">Accuracy scores shown for design only</text>
  <path d="M644 375 H949" stroke="#9c6450" stroke-width="1"/>
  <text x="644" y="388" font-family="Arial,sans-serif"
        font-size="10" fill="#d8ac99">Final selection depends on test performance</text>

  <!-- Right: evaluation metrics card -->
  <g class="float">
    <rect x="993" y="88" width="158" height="137" rx="14"
          fill="#45251f" stroke="#c8856b" stroke-width="1.4"/>
    <text x="1010" y="113" class="small" font-size="9">EVALUATION METRICS</text>
    <rect x="1010" y="128" width="58" height="32" rx="7"
          fill="#60372b" stroke="#b8755c" stroke-width="1"/>
    <text x="1039" y="148" text-anchor="middle"
          font-family="Arial,sans-serif" font-size="12"
          font-weight="700" fill="#ffe0c9">F1</text>
    <rect x="1077" y="128" width="57" height="32" rx="7"
          fill="#60372b" stroke="#b8755c" stroke-width="1"/>
    <text x="1105" y="148" text-anchor="middle"
          font-family="Arial,sans-serif" font-size="12"
          font-weight="700" fill="#ffe0c9">AUC</text>
    <text x="1010" y="183" font-family="Arial,sans-serif"
          font-size="11" fill="#f4c7b0">Precision · Recall</text>
    <text x="1010" y="201" font-family="Arial,sans-serif"
          font-size="11" fill="#f4c7b0">Confusion Matrix</text>
    <circle cx="1133" cy="208" r="4" fill="#ffc6a5" class="pulse"/>
  </g>

  <!-- Best model selection card -->
  <g class="float" style="animation-delay:-1s">
    <rect x="993" y="243" width="158" height="116" rx="14"
          fill="#45251f" stroke="#c8856b" stroke-width="1.4"/>
    <text x="1010" y="268" class="small" font-size="9">FINAL DECISION</text>
    <circle cx="1024" cy="293" r="9" fill="#f3a17f" opacity=".18"/>
    <circle cx="1024" cy="293" r="6" fill="none"
            stroke="#ffc6a5" stroke-width="1.5"/>
    <path d="M1021 293 L1023 296 L1028 290"
          fill="none" stroke="#ffe0c9" stroke-width="1.5"/>
    <text x="1040" y="297" font-family="Arial,sans-serif"
          font-size="12" font-weight="700" fill="#ffe0c9">Best Model</text>
    <path d="M1010 311 H1134" stroke="#9c6450" stroke-width="1"/>
    <text x="1010" y="330" font-family="Arial,sans-serif"
          font-size="10" fill="#d8ac99">Validate on unseen</text>
    <text x="1010" y="344" font-family="Arial,sans-serif"
          font-size="10" fill="#d8ac99">test data</text>
  </g>

  <!-- Animated connector -->
  <path d="M950 218 H976 Q984 218 984 228 V290 H993"
        fill="none" stroke="#e9a68b" stroke-width="1.4"
        stroke-dasharray="4 5" class="dash"/>
  <circle cx="976" cy="218" r="3" fill="#ffc7a8" class="pulse"/>

  <!-- Status pill -->
  <rect x="862" y="413" width="265" height="34" rx="17"
        fill="#2b1712" stroke="#b8755c" stroke-width="1.2"/>
  <circle cx="883" cy="430" r="5" fill="#ffc6a5" filter="url(#glow)"/>
  <text x="898" y="434" font-family="Arial,sans-serif"
        font-size="11" letter-spacing="1.6" fill="#f5c7ad">PERFORMANCE REVIEW</text>

  <!-- Bottom waves -->
  <path d="M0 420 C130 370 210 468 350 439
           S540 395 675 445 S900 480 1050 433 S1155 417 1200 433"
        fill="none" stroke="#b96d55" stroke-width="1.2" opacity=".65"/>
  <path d="M0 444 C130 397 220 490 360 460
           S550 416 690 462 S920 495 1060 455 S1155 438 1200 453"
        fill="none" stroke="#a75e49" stroke-width="1" opacity=".5"/>
  <g fill="#ffc4a5" filter="url(#glow)" class="pulse">
    <circle cx="350" cy="439" r="3"/>
    <circle cx="675" cy="445" r="3"/>
    <circle cx="1050" cy="433" r="3"/>
  </g>

  <!-- Footer -->
  <text x="100" y="461" font-family="Arial,sans-serif"
        font-size="10" letter-spacing="2.5" fill="#c88d76">
    COMPARE  ·  EVALUATE  ·  SELECT
  </text>

  <!-- Corner accent -->
  <path d="M1120 80 H1144 V104 M1144 80 L1124 100"
        fill="none" stroke="#f4b59a" stroke-width="1.8"/>
</svg>
