
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#321715"/>
      <stop offset="55%" stop-color="#28140f"/>
      <stop offset="100%" stop-color="#1b100d"/>
    </linearGradient>
    <linearGradient id="peach" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe0c9"/>
      <stop offset="100%" stop-color="#f09a79"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#efb49c" opacity=".22"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .small{font-family:Arial,sans-serif;fill:#d9ad9a;letter-spacing:2.5px}
      .float{animation:float 3s ease-in-out infinite}
      .pulse{animation:pulse 2s ease-in-out infinite}
      .dash{stroke-dasharray:5 7;animation:dash 7s linear infinite}
      .orbit{transform-box:fill-box;transform-origin:center;animation:spin 16s linear infinite}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
      @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
      @keyframes dash{to{stroke-dashoffset:-120}}
      @keyframes spin{to{transform:rotate(360deg)}}
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="500" rx="25" fill="url(#bg)"/>
  <rect width="1200" height="500" rx="25" fill="url(#dots)"/>
  <rect x="30" y="30" width="1140" height="440" rx="24"
        fill="none" stroke="#9c6252" stroke-opacity=".55"/>

  <!-- Header -->
  <circle cx="82" cy="80" r="6" fill="#ffd1b5" filter="url(#glow)"/>
  <path d="M82 80 H275" stroke="#f4b59a" stroke-width="3"
        stroke-linecap="round"/>
  <text x="100" y="113" class="small" font-size="13">MACHINE LEARNING / CLASSIFICATION</text>

  <!-- Title -->
  <text x="98" y="215" font-family="Arial,sans-serif"
        font-size="57" font-weight="700" fill="#fff4ed">Part D :</text>
  <text x="98" y="278" font-family="Arial,sans-serif"
        font-size="43" font-weight="700" fill="url(#peach)">Support Vector</text>
  <text x="98" y="331" font-family="Arial,sans-serif"
        font-size="43" font-weight="700" fill="url(#peach)">Machine Classifier</text>

  <rect x="100" y="354" width="112" height="5" rx="2.5" fill="#f4a88a"/>
  <text x="100" y="394" font-family="Arial,sans-serif"
        font-size="17" fill="#e8c7b8">Find the Optimal Hyperplane</text>
  <circle cx="342" cy="388" r="3.5" fill="#f6a17f"/>
  <text x="357" y="394" font-family="Arial,sans-serif"
        font-size="17" fill="#e8c7b8">Maximize the Margin</text>

  <!-- Main visualization panel -->
  <rect x="625" y="68" width="360" height="330" rx="17"
        fill="#261410" stroke="#855344" stroke-width="1.2"/>
  <text x="649" y="96" class="small" font-size="11">SVM DECISION BOUNDARY</text>
  <text x="649" y="116" font-family="Arial,sans-serif"
        font-size="11" fill="#b99180">Maximum-margin classification</text>

  <!-- Plot grid -->
  <g stroke="#a66e59" stroke-width=".7" opacity=".22">
    <path d="M660 140 V364 M700 140 V364 M740 140 V364
             M780 140 V364 M820 140 V364 M860 140 V364
             M900 140 V364 M940 140 V364"/>
    <path d="M660 140 H950 M660 180 H950 M660 220 H950
             M660 260 H950 M660 300 H950 M660 340 H950"/>
  </g>

  <!-- Decision regions -->
  <path d="M660 140 H950 V180 L660 340 Z"
        fill="#f2a17f" opacity=".055"/>
  <path d="M660 364 V340 L950 180 V364 Z"
        fill="#ead2c2" opacity=".045"/>

  <!-- Margin boundaries and hyperplane -->
  <path d="M665 319 L945 163" fill="none"
        stroke="#e7c3ad" stroke-width="1.6"
        stroke-dasharray="6 6" class="dash"/>
  <path d="M665 355 L945 199" fill="none"
        stroke="#e7c3ad" stroke-width="1.6"
        stroke-dasharray="6 6" class="dash"/>
  <path d="M665 337 L945 181" fill="none"
        stroke="#ffb18f" stroke-width="3"
        stroke-linecap="round" filter="url(#glow)"/>

  <!-- Class A: circular points -->
  <g fill="#f3a17f">
    <circle cx="698" cy="175" r="6"/>
    <circle cx="724" cy="213" r="6"/>
    <circle cx="750" cy="184" r="6"/>
    <circle cx="764" cy="249" r="6"/>
    <circle cx="789" cy="215" r="6"/>
    <circle cx="802" cy="274" r="6"/>
    <circle cx="831" cy="250" r="6"/>
    <circle cx="684" cy="258" r="6"/>
  </g>

  <!-- Class B: square points -->
  <g fill="#e8d4c5">
    <rect x="837" y="297" width="12" height="12" rx="2"/>
    <rect x="871" y="325" width="12" height="12" rx="2"/>
    <rect x="898" y="283" width="12" height="12" rx="2"/>
    <rect x="921" y="323" width="12" height="12" rx="2"/>
    <rect x="873" y="252" width="12" height="12" rx="2"/>
    <rect x="915" y="239" width="12" height="12" rx="2"/>
    <rect x="848" y="348" width="12" height="12" rx="2"/>
  </g>

  <!-- Support vectors highlighted -->
  <g fill="none" stroke="#ffe0c9" stroke-width="2.2" class="pulse">
    <circle cx="802" cy="274" r="11"/>
    <circle cx="837" cy="303" r="11"/>
    <circle cx="873" cy="258" r="11"/>
  </g>

  <!-- Distance indicators -->
  <g fill="none" stroke="#ffbd9c" stroke-width="1.3" class="dash">
    <path d="M802 274 L802 261"/>
    <path d="M837 303 L837 286"/>
    <path d="M873 258 L873 241"/>
  </g>

  <!-- Hyperplane label -->
  <g class="float">
    <rect x="750" y="126" width="139" height="26" rx="13"
          fill="#43241d" stroke="#c9866c" stroke-width="1"/>
    <text x="819" y="143" text-anchor="middle"
          font-family="Arial,sans-serif" font-size="10"
          letter-spacing="1.2" fill="#ffe0c9">HYPERPLANE</text>
  </g>

  <!-- Legend -->
  <circle cx="665" cy="382" r="4" fill="#f3a17f"/>
  <text x="675" y="386" font-family="Arial,sans-serif"
        font-size="10" fill="#e8c7b8">Class A</text>
  <rect x="750" y="378" width="8" height="8" rx="1" fill="#e8d4c5"/>
  <text x="765" y="386" font-family="Arial,sans-serif"
        font-size="10" fill="#e8c7b8">Class B</text>
  <circle cx="850" cy="382" r="6" fill="none" stroke="#ffe0c9" stroke-width="1.5"/>
  <text x="862" y="386" font-family="Arial,sans-serif"
        font-size="10" fill="#e8c7b8">Support Vector</text>

  <!-- Right-side model card -->
  <g class="float">
    <rect x="1000" y="117" width="151" height="112" rx="14"
          fill="#45251f" stroke="#c8856b" stroke-width="1.4"/>
    <text x="1018" y="142" class="small" font-size="9">CORE CONCEPT</text>
    <circle cx="1026" cy="170" r="6" fill="#f3a17f"/>
    <path d="M1038 170 H1129" stroke="#c88d76" stroke-width="1.5"/>
    <circle cx="1026" cy="192" r="6" fill="#e8d4c5"/>
    <path d="M1038 192 H1110" stroke="#c88d76" stroke-width="1.5"/>
    <text x="1018" y="215" font-family="Arial,sans-serif"
          font-size="10" fill="#f5c7ad">Separate two classes</text>
  </g>

  <!-- Margin card -->
  <g class="float" style="animation-delay:-1s">
    <rect x="1000" y="246" width="151" height="112" rx="14"
          fill="#45251f" stroke="#c8856b" stroke-width="1.4"/>
    <text x="1018" y="270" class="small" font-size="9">OBJECTIVE</text>
    <path d="M1020 312 L1060 287 M1020 325 L1060 300"
          stroke="#e8d4c5" stroke-width="1.5" stroke-dasharray="4 4"/>
    <path d="M1020 319 L1060 294" stroke="#ffb18f" stroke-width="2.5"/>
    <path d="M1072 293 V320 M1067 298 L1072 293 L1077 298
             M1067 315 L1072 320 L1077 315"
          fill="none" stroke="#ffc6a5" stroke-width="1.6"/>
    <text x="1085" y="302" font-family="Arial,sans-serif"
          font-size="10" fill="#ffe0c9">Maximize</text>
    <text x="1085" y="315" font-family="Arial,sans-serif"
          font-size="10" fill="#ffe0c9">Margin</text>
    <circle cx="1129" cy="338" r="4" fill="#ffc6a5" class="pulse"/>
  </g>

  <!-- Connection -->
  <path d="M945 181 H975 Q987 181 987 193 V294 H1000"
        fill="none" stroke="#e9a68b" stroke-width="1.3"
        stroke-dasharray="4 5" class="dash"/>
  <circle cx="975" cy="181" r="3" fill="#ffc7a8" class="pulse"/>

  <!-- Status pill -->
  <rect x="874" y="412" width="246" height="34" rx="17"
        fill="#2b1712" stroke="#b8755c" stroke-width="1.2"/>
  <circle cx="895" cy="429" r="5" fill="#ffc6a5" filter="url(#glow)"/>
  <text x="910" y="433" font-family="Arial,sans-serif"
        font-size="11" letter-spacing="1.8" fill="#f5c7ad">OPTIMAL MARGIN</text>

  <!-- Bottom flowing lines -->
  <path d="M0 420 C130 370 210 468 350 439
           S540 395 675 445 S900 480 1050 433 S1155 417 1200 433"
        fill="none" stroke="#b96d55" stroke-width="1.2" opacity=".65"/>
  <path d="M0 444 C130 397 220 490 360 460
           S550 416 690 462 S920 495 1060 455 S1155 438 1200 453"
        fill="none" stroke="#a75e49" stroke-width="1" opacity=".5"/>
  <g fill="#ffc4a5" filter="url(#glow)" class="pulse">
    <circle cx="350" cy="439" r="3"/>
    <circle cx="675" cy="445" r="3"/>
    <circle cx="1050" cy="433" r="3"/>
  </g>

  <!-- Footer -->
  <text x="100" y="461" font-family="Arial,sans-serif"
        font-size="10" letter-spacing="2.5" fill="#c88d76">
    SUPPORT VECTORS  ·  HYPERPLANE  ·  MARGIN
  </text>

  <!-- Corner arrow -->
  <path d="M1120 80 H1144 V104 M1144 80 L1124 100"
        fill="none" stroke="#f4b59a" stroke-width="1.8"/>
</svg>
